<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Main body: near-black with deep dark-ruby depth -->
    <linearGradient id="body" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#1c0d26"/>
      <stop offset="100%" stop-color="#060409"/>
    </linearGradient>
    <!-- Table facet: top flat surface, slightly lighter -->
    <linearGradient id="table" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1440"/>
      <stop offset="100%" stop-color="#14092a"/>
    </linearGradient>
  </defs>

  <!-- ── Pentagon gem body ── -->
  <!-- Outer silhouette: flat-top pentagon -->
  <polygon points="6,9 26,9 30,20 16,30 2,20" fill="url(#body)"/>

  <!-- Table facet (the flat top crown) -->
  <polygon points="9,9 23,9 25,15 16,17 7,15" fill="url(#table)"/>

  <!-- Left crown facet -->
  <polygon points="6,9 9,9 7,15 2,20" fill="#160920"/>

  <!-- Right crown facet (darker — shadow side) -->
  <polygon points="26,9 23,9 25,15 30,20" fill="#09060e"/>

  <!-- Lower-left pavilion -->
  <polygon points="2,20 7,15 16,17 16,30" fill="#12091c"/>

  <!-- Lower-right pavilion (darkest) -->
  <polygon points="30,20 25,15 16,17 16,30" fill="#07040c"/>

  <!-- ── Facet edge lines ── -->
  <!-- Outer gem edge -->
  <polygon points="6,9 26,9 30,20 16,30 2,20" fill="none" stroke="#4a1e60" stroke-width="0.8"/>
  <!-- Crown facet edges -->
  <line x1="9" y1="9" x2="7" y2="15" stroke="#2a1038" stroke-width="0.5"/>
  <line x1="23" y1="9" x2="25" y2="15" stroke="#1a0a22" stroke-width="0.5"/>
  <!-- Girdle to culet lines -->
  <line x1="7" y1="15" x2="16" y2="17" stroke="#20102e" stroke-width="0.5"/>
  <line x1="25" y1="15" x2="16" y2="17" stroke="#16091e" stroke-width="0.5"/>
  <line x1="16" y1="17" x2="16" y2="30" stroke="#130820" stroke-width="0.5"/>

  <!-- ── Polished glint (top-left of table) ── -->
  <ellipse cx="12" cy="11" rx="2.8" ry="1.3"
    fill="white" fill-opacity="0.09"
    transform="rotate(-18 12 11)"/>
</svg>

